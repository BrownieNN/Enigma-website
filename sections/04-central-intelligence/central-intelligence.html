<!-- ENIGMA / 04 — Central Intelligence (WebGL resin metaballs)
     Cream panel. A RawShaderMaterial raymarches three coloured metaball
     bodies and REFRACTS the headline through them — so "Central
     Intelligence" and the legend are painted by the shader into a texture,
     not laid out in the DOM. The <h1> and the key below are the accessible
     twins: visually hidden, present for assistive tech and no-WebGL readers.
     Drag anywhere in the panel to push the resin around. -->
<div class="en-section en-central-intelligence">
  <div class="al-capabilities al-resin-host" data-text="Central Intelligence">
    <h1 class="al-resin-heading">Central Intelligence</h1>
    <canvas class="al-resin-canvas"></canvas>
    <div class="al-planet-tag" data-piece="creative">
      <div class="al-planet-tag-text">
        <p class="al-planet-label"><span class="al-planet-dot"></span>Creative</p>
        <p class="al-planet-code al-planet-code-a">SDDS 55213 5518</p>
        <p class="al-planet-code al-planet-code-b">////SE 2230</p>
      </div>
    </div>
    <div class="al-planet-tag" data-piece="ci">
      <div class="al-planet-tag-text">
        <p class="al-planet-label"><span class="al-planet-dot"></span>Central Intelligence</p>
        <p class="al-planet-code al-planet-code-a">SDDS 55213 5518</p>
        <p class="al-planet-code al-planet-code-b">////SE 2230</p>
      </div>
    </div>
    <div class="al-planet-tag" data-piece="media">
      <div class="al-planet-tag-text">
        <p class="al-planet-label"><span class="al-planet-dot"></span>Media</p>
        <p class="al-planet-code al-planet-code-a">01235 55233 555488</p>
        <p class="al-planet-code al-planet-code-b">////DA 2230</p>
      </div>
    </div>
    <div class="al-planet-key">
      <span><span class="al-planet-dot c-ci"></span>Central Intelligence</span>
      <span><span class="al-planet-dot c-creative"></span>Creative</span>
      <span><span class="al-planet-dot c-media"></span>Media</span>
    </div>
  </div>
</div>
